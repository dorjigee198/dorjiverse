{% load static %}
<nav class="fixed top-0 inset-x-0 z-50 bg-slate-950/80 backdrop-blur-lg border-b border-slate-800/60">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a href="{% url 'core:home' %}" class="group flex items-center gap-2">
        <span class="text-xl font-black tracking-tight bg-gradient-to-r from-brand-400 to-purple-400 bg-clip-text text-transparent">
          Dorjivers
        </span>
        <span class="text-slate-600 group-hover:text-slate-500 transition text-xs font-mono">.me</span>
      </a>

      <!-- Desktop links -->
      <div class="hidden md:flex items-center gap-1">
        {% with path=request.resolver_match %}
        <a href="{% url 'core:home' %}"
           class="px-4 py-2 rounded-lg text-sm font-medium transition-colors
             {% if path.url_name == 'home' and path.namespace == 'core' %}text-brand-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
          Home
        </a>
        <a href="{% url 'core:about' %}"
           class="px-4 py-2 rounded-lg text-sm font-medium transition-colors
             {% if path.url_name == 'about' %}text-brand-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
          About
        </a>
        <a href="{% url 'portfolio:project_list' %}"
           class="px-4 py-2 rounded-lg text-sm font-medium transition-colors
             {% if path.namespace == 'portfolio' %}text-brand-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
          Portfolio
        </a>
        <a href="{% url 'blog:blog_list' %}"
           class="px-4 py-2 rounded-lg text-sm font-medium transition-colors
             {% if path.namespace == 'blog' %}text-brand-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
          Blog
        </a>
        <a href="{% url 'core:contact' %}"
           class="px-4 py-2 rounded-lg text-sm font-medium transition-colors
             {% if path.url_name == 'contact' %}text-brand-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
          Contact
        </a>
        {% endwith %}
        <a href="{% url 'core:resume_download' %}"
           class="ml-2 px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-sm font-semibold transition-colors flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Resume
        </a>
      </div>

      <!-- Mobile hamburger -->
      <button id="nav-toggle" class="md:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-nav" class="hidden md:hidden pb-4 pt-2 border-t border-slate-800 mt-0">
      <div class="flex flex-col gap-1">
        <a href="{% url 'core:home' %}" class="px-4 py-2.5 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg text-sm font-medium transition">Home</a>
        <a href="{% url 'core:about' %}" class="px-4 py-2.5 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg text-sm font-medium transition">About</a>
        <a href="{% url 'portfolio:project_list' %}" class="px-4 py-2.5 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg text-sm font-medium transition">Portfolio</a>
        <a href="{% url 'blog:blog_list' %}" class="px-4 py-2.5 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg text-sm font-medium transition">Blog</a>
        <a href="{% url 'core:contact' %}" class="px-4 py-2.5 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg text-sm font-medium transition">Contact</a>
        <a href="{% url 'core:resume_download' %}" class="px-4 py-2.5 text-brand-400 font-semibold text-sm">⬇ Download Resume</a>
      </div>
    </div>
  </div>
</nav>
